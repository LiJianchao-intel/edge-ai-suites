server {
    listen ${UI_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 300M;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://${SERVER_HOST}:${SMARTHOME_API_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_set_header Connection "";
    }

    location /v1/stats/ {
        proxy_pass http://${SERVER_HOST}:${STATS_API_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_set_header Connection "";
    }
    
    location  /ws {
        proxy_pass http://${SERVER_HOST}:${VITE_CHATBOT_WS_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
    }

    location /v1/ {
        proxy_pass http://${SERVER_HOST}:${RAG_API_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_set_header Connection "";
    }

     location /home/user/ {
        proxy_pass http://${SERVER_HOST}:${RAG_API_PORT};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

   location /v1/chatqna {
        proxy_pass http://${SERVER_HOST}:${RAG_CHAT_PORT};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        gzip off;
        proxy_set_header Host ${SERVER_HOST}:${RAG_CHAT_PORT};
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
