services:
  smart-community-ui:
    image: ${REGISTRY:-intel}/smart-community-ui:${TAG:-latest}
    container_name: smart-community-ui
    environment:
      no_proxy: ${no_proxy:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      UI_PORT: ${UI_PORT:-8100}
      SERVER_HOST: ${SERVER_HOST:-${HOST_IP:-127.0.0.1}}
      SMARTHOME_API_PORT: ${SMARTHOME_API_PORT:-3100}
      RAG_API_PORT: ${RAG_API_PORT:-16010}
      RAG_CHAT_PORT: ${RAG_CHAT_PORT:-16011}
    restart: always
    network_mode: host
